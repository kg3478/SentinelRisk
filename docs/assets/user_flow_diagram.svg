<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f97316"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#818cf8"/>
    </marker>
  </defs>

  <style>
    .hdr-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 24px; font-weight: 800; fill: #ffffff; }
    .hdr-sub { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; fill: #94a3b8; }
    .lane-title { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
    .box-title { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
    .box-text { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 400; fill: #94a3b8; }
    .decision-label { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 800; text-anchor: middle; }
  </style>

  <!-- Background -->
  <rect width="1200" height="780" fill="url(#bgGrad)" rx="16"/>
  <rect x="1" y="1" width="1198" height="778" fill="none" stroke="#334155" stroke-width="1.5" rx="16"/>

  <!-- Header -->
  <g transform="translate(40, 42)">
    <rect x="-8" y="-6" width="34" height="34" rx="8" fill="#3b82f6" opacity="0.2"/>
    <path d="M 2 12 L 8 2 L 14 12 L 20 2" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="12" class="hdr-title">SentinelRisk User Journey &amp; Transaction Flow</text>
    <text x="36" y="28" class="hdr-sub">End-to-End Operational Lifecycle: Authorization, Automated Decisioning, Analyst Case Queue &amp; Policy Tuning</text>
  </g>

  <!-- SWIMLANE 1: PAYMENT GATEWAY & CARDHOLDER (Y: 100 - 240) -->
  <rect x="30" y="100" width="1140" height="150" rx="10" fill="#0b1329" stroke="#1e293b"/>
  <text x="50" y="128" class="lane-title" fill="#38bdf8">LANE 1: TRANSACTION INITIATION &amp; CONSUMER EXPERIENCE</text>

  <!-- Node: Payment Attempt -->
  <g transform="translate(50, 145)">
    <rect width="180" height="85" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="14" y="24" class="box-title">Card Transaction</text>
    <text x="14" y="42" class="box-text">Cardholder buys item</text>
    <text x="14" y="58" class="box-text">Amount: €45 - €3,800</text>
    <text x="14" y="74" class="box-text" fill="#38bdf8">Payload sent via API</text>
  </g>

  <!-- Node: Immediate Allow Clearance -->
  <g transform="translate(370, 145)">
    <rect width="170" height="85" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="14" y="24" class="box-title" fill="#6ee7b7">Cleared / Authorized</text>
    <text x="14" y="42" class="box-text" fill="#a7f3d0">Instant approval (&lt;15ms)</text>
    <text x="14" y="58" class="box-text" fill="#a7f3d0">Zero customer friction</text>
    <text x="14" y="74" class="box-text" fill="#6ee7b7" font-weight="700">95.8% of volume</text>
  </g>

  <!-- Node: 3DS / 2FA Step-up Challenge -->
  <g transform="translate(570, 145)">
    <rect width="170" height="85" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="14" y="24" class="box-title" fill="#fde68a">Step-Up Challenge</text>
    <text x="14" y="42" class="box-text" fill="#fde68a">SMS OTP / Biometric 3DS</text>
    <text x="14" y="58" class="box-text" fill="#fde68a">Customer proves identity</text>
    <text x="14" y="74" class="box-text" fill="#f59e0b" font-weight="700">3.0% of volume</text>
  </g>

  <!-- Node: Transaction Declined -->
  <g transform="translate(770, 145)">
    <rect width="170" height="85" rx="8" fill="#4c0519" stroke="#ef4444" stroke-width="1.5"/>
    <text x="14" y="24" class="box-title" fill="#fca5a5">Transaction Declined</text>
    <text x="14" y="42" class="box-text" fill="#fca5a5">Hard block policy hit</text>
    <text x="14" y="58" class="box-text" fill="#fca5a5">Merchant notified: Reject</text>
    <text x="14" y="74" class="box-text" fill="#ef4444" font-weight="700">Prevents chargeback loss</text>
  </g>

  <!-- Node: Settlement -->
  <g transform="translate(970, 145)">
    <rect width="180" height="85" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    <text x="14" y="24" class="box-title">Settlement &amp; Ledger</text>
    <text x="14" y="42" class="box-text">Payment captured</text>
    <text x="14" y="58" class="box-text">Audit event logged</text>
    <text x="14" y="74" class="box-text" fill="#94a3b8">Immutable SQL schema</text>
  </g>

  <!-- SWIMLANE 2: SENTINELRISK REAL-TIME DECISION ENGINE (Y: 270 - 450) -->
  <rect x="30" y="270" width="1140" height="180" rx="10" fill="#0b1329" stroke="#1e293b"/>
  <text x="50" y="298" class="lane-title" fill="#818cf8">LANE 2: SENTINELRISK REAL-TIME INFERENCE &amp; DECISION POLICY ENGINE</text>

  <!-- Node: Feature Extraction -->
  <g transform="translate(50, 315)">
    <rect width="180" height="115" rx="8" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="14" y="24" class="box-title">Feature Extraction</text>
    <text x="14" y="42" class="box-text">Rolling velocities (1h/6h)</text>
    <text x="14" y="58" class="box-text">Amount z-score &amp; log1p</text>
    <text x="14" y="74" class="box-text">Cyclic sin/cos hour</text>
    <text x="14" y="98" class="box-text" fill="#22d3ee" font-weight="600">Latency: 2.1ms</text>
  </g>

  <!-- Node: Parallel Scoring: ML + Rules -->
  <g transform="translate(260, 315)">
    <rect width="240" height="115" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="14" y="24" class="box-title">Dual Risk Assessment</text>
    <text x="14" y="44" class="box-text">• LightGBM + Platt Scaling (0-100)</text>
    <text x="14" y="60" class="box-text">• 5 Deterministic Risk Rules</text>
    <text x="14" y="76" class="box-text">• SHAP Signal Contributions</text>
    <text x="14" y="98" class="box-text" fill="#818cf8" font-weight="600">Latency: 5.7ms | PR-AUC: 0.854</text>
  </g>

  <!-- Node: Policy Decision Arbiter -->
  <g transform="translate(530, 315)">
    <rect width="300" height="115" rx="8" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.8"/>
    <text x="14" y="24" class="box-title">Decision Arbiter Matrix</text>
    <text x="14" y="44" class="box-text" fill="#6ee7b7">Score &lt;= 20 &amp; No Rules → <tspan font-weight="800">ALLOW</tspan></text>
    <text x="14" y="60" class="box-text" fill="#fcd34d">20 &lt; Score &lt;= 50 OR Medium → <tspan font-weight="800">CHALLENGE</tspan></text>
    <text x="14" y="76" class="box-text" fill="#fdba74">50 &lt; Score &lt; 75 OR High Rule → <tspan font-weight="800">REVIEW</tspan></text>
    <text x="14" y="92" class="box-text" fill="#fca5a5">Score &gt;= 75 OR Critical Rule → <tspan font-weight="800">BLOCK</tspan></text>
  </g>

  <!-- Node: Automatic Case Creator -->
  <g transform="translate(860, 315)">
    <rect width="190" height="115" rx="8" fill="url(#cardGrad)" stroke="#f97316" stroke-width="1.5"/>
    <text x="14" y="24" class="box-title">Automated Case Dispatch</text>
    <text x="14" y="44" class="box-text">Trigger: Decision in</text>
    <text x="14" y="60" class="box-text">[REVIEW, BLOCK]</text>
    <text x="14" y="76" class="box-text">Generates Case ID &amp; priority</text>
    <text x="14" y="98" class="box-text" fill="#fb923c" font-weight="600">Instant Queue Ingestion</text>
  </g>

  <!-- SWIMLANE 3: HUMAN INVESTIGATION & OPERATIONAL MANAGEMENT (Y: 470 - 740) -->
  <rect x="30" y="470" width="1140" height="275" rx="10" fill="#0b1329" stroke="#1e293b"/>
  <text x="50" y="498" class="lane-title" fill="#f97316">LANE 3: HUMAN INVESTIGATION, POLICY SIMULATION &amp; GOVERNANCE</text>

  <!-- Node: Analyst Queue Interface -->
  <g transform="translate(50, 520)">
    <rect width="250" height="205" rx="8" fill="url(#cardGrad)" stroke="#f97316" stroke-width="1.5"/>
    <text x="16" y="26" class="box-title">Fraud Analyst Queue</text>
    <text x="16" y="44" class="box-text">Route: /cases</text>
    
    <rect x="12" y="56" width="226" height="42" rx="4" fill="#1e293b"/>
    <text x="20" y="72" font-size="11" font-weight="700" fill="#f8fafc">CASE-9F2B81</text>
    <text x="20" y="88" font-size="10" fill="#f97316">Risk: 78.4 | Priority: CRITICAL</text>
    
    <text x="16" y="118" class="box-text">• Inspects Triggered Rules</text>
    <text x="16" y="134" class="box-text">• Evaluates SHAP Signals</text>
    <text x="16" y="150" class="box-text">• Checks historical card velocity</text>
    <text x="16" y="166" class="box-text">• Reviews merchant category</text>
    <text x="16" y="196" font-size="11" fill="#fdba74" font-weight="700">Analyst Workflow Console</text>
  </g>

  <!-- Node: Analyst Decision Override -->
  <g transform="translate(330, 520)">
    <rect width="250" height="205" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="26" class="box-title">Decision Override &amp; Notes</text>
    <text x="16" y="44" class="box-text">Human-in-the-Loop Verdict</text>

    <g transform="translate(16, 56)">
      <rect width="98" height="26" rx="4" fill="#064e3b" stroke="#10b981"/>
      <text x="49" y="17" class="decision-label" fill="#6ee7b7">APPROVE</text>
    </g>
    <g transform="translate(124, 56)">
      <rect width="98" height="26" rx="4" fill="#4c0519" stroke="#ef4444"/>
      <text x="49" y="17" class="decision-label" fill="#fca5a5">REJECT</text>
    </g>

    <text x="16" y="106" class="box-text" font-weight="700" fill="#f8fafc">Mandatory Justification Log:</text>
    <rect x="14" y="114" width="222" height="48" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="20" y="132" font-size="10" fill="#94a3b8" font-style="italic">"Cardholder confirmed purchase</text>
    <text x="20" y="146" font-size="10" fill="#94a3b8" font-style="italic">via phone auth. False alarm."</text>

    <text x="16" y="180" class="box-text" fill="#34d399">Writes to Immutable AuditLog</text>
    <text x="16" y="196" class="box-text" fill="#94a3b8">Updates case status: RESOLVED</text>
  </g>

  <!-- Node: Risk Manager Simulator -->
  <g transform="translate(610, 520)">
    <rect width="260" height="205" rx="8" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="16" y="26" class="box-title">Cost-Sensitive Policy Simulator</text>
    <text x="16" y="44" class="box-text">Route: /thresholds</text>

    <text x="16" y="70" class="box-text">• Adjust Allow Cutoff (0-50)</text>
    <text x="16" y="86" class="box-text">• Adjust Review Cutoff (50-90)</text>
    <text x="16" y="102" class="box-text">• Set False Positive Cost ($50)</text>
    <text x="16" y="118" class="box-text">• Set Missed Fraud Loss ($100)</text>
    <text x="16" y="134" class="box-text">• Set Manual Review Cost ($15)</text>

    <rect x="14" y="148" width="232" height="45" rx="4" fill="#1e1b4b" stroke="#4338ca"/>
    <text x="22" y="166" font-size="11" font-weight="700" fill="#c084fc">Net Financial Impact Simulator</text>
    <text x="22" y="182" font-size="10" fill="#e0e7ff">Finds profit-maximizing cutoff</text>
  </g>

  <!-- Node: Drift Monitor & Health -->
  <g transform="translate(900, 520)">
    <rect width="250" height="205" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="16" y="26" class="box-title">Model Health &amp; Drift Monitor</text>
    <text x="16" y="44" class="box-text">Route: /monitoring</text>

    <text x="16" y="72" class="box-text">Population Stability Index (PSI):</text>
    <text x="16" y="92" font-size="13" font-weight="800" fill="#10b981">PSI = 0.0182 (No Drift)</text>
    <text x="16" y="112" class="box-text">KS-Statistic: 0.042 (Normal)</text>
    <text x="16" y="128" class="box-text">Latency SLA: 14.5ms (&lt;20ms)</text>
    <text x="16" y="144" class="box-text">Test PR-AUC: 0.8542</text>

    <rect x="14" y="158" width="222" height="35" rx="4" fill="#082f49" stroke="#0284c7"/>
    <text x="22" y="180" font-size="11" font-weight="700" fill="#38bdf8">Automated Retrain Trigger</text>
  </g>

  <!-- CONNECTIONS -->
  <!-- Lane 1 -> Lane 2 -->
  <path d="M 140 230 L 140 315" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-indigo)"/>
  
  <!-- Lane 2 Feature -> Parallel -->
  <path d="M 230 372 L 260 372" fill="none" stroke="#06b6d4" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Parallel -> Policy Arbiter -->
  <path d="M 500 372 L 530 372" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arr-indigo)"/>

  <!-- Decision Policy -> Outcomes in Lane 1 -->
  <!-- ALLOW -->
  <path d="M 680 315 Q 680 260 455 260 L 455 230" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <!-- CHALLENGE -->
  <path d="M 680 315 Q 680 240 655 240 L 655 230" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-amber)"/>
  <!-- BLOCK -->
  <path d="M 720 315 Q 720 260 855 260 L 855 230" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Policy Arbiter -> Case Dispatch -->
  <path d="M 830 372 L 860 372" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#arr-orange)"/>

  <!-- Case Dispatch -> Analyst Queue (Lane 3) -->
  <path d="M 955 430 Q 955 460 175 460 L 175 520" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#arr-orange)"/>

  <!-- Analyst Queue -> Override -->
  <path d="M 300 622 L 330 622" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Challenge -> Resolved settlement -->
  <path d="M 740 187 L 970 187" fill="none" stroke="#64748b" stroke-dasharray="3 3" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
